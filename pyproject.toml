[project]
name = "aidashboard"
version = "0.1.0"
description = "Painel animado em tempo real das sessões do Claude Code, visto no celular pela rede local"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.24",
    "qrcode>=7.4",
]

[project.scripts]
aidashboard = "aidashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidashboard"]
